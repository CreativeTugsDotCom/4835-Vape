      function SnowfallCanvas({ enabled }) {
        const canvasRef = useRef(null);

        useEffect(() => {
          if (!enabled) return;
          const prefersReduced =
            typeof window !== 'undefined' &&
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (prefersReduced) return;

          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          let animationId;
          let width = (canvas.width = window.innerWidth);
          let height = (canvas.height = window.innerHeight);

          const flakeCount = Math.min(48, Math.floor(width / 28));
          const flakes = Array.from({ length: flakeCount }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 2.1 + 0.8,
            speedY: Math.random() * 0.65 + 0.25,
            speedX: (Math.random() - 0.5) * 0.35,
            opacity: Math.random() * 0.45 + 0.15,
            isGold: Math.random() > 0.82
          }));

          const handleResize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };
          window.addEventListener('resize', handleResize);

          const draw = () => {
            ctx.clearRect(0, 0, width, height);
            for (const f of flakes) {
              ctx.beginPath();
              ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
              ctx.fillStyle = f.isGold
                ? `rgba(242, 201, 22, ${f.opacity})`
                : `rgba(255, 255, 255, ${f.opacity})`;
              ctx.fill();

              f.y += f.speedY;
              f.x += f.speedX;

              if (f.y > height + 5) {
                f.y = -5;
                f.x = Math.random() * width;
              }
              if (f.x > width + 5) f.x = -5;
              if (f.x < -5) f.x = width + 5;
            }
            animationId = window.requestAnimationFrame(draw);
          };

          draw();

          return () => {
            window.cancelAnimationFrame(animationId);
            window.removeEventListener('resize', handleResize);
          };
        }, [enabled]);

        if (!enabled) return null;

        return h('canvas', {
          ref: canvasRef,
          'aria-hidden': 'true',
          className: 'fixed inset-0 pointer-events-none z-40'
        });
      }

      // Hook into the early <head> cutout engine (zero raw mosaic flash)
      function useBackgroundRemovedImage(src) {
        const engine = window.__4835CutoutEngine;
        const [entry, setEntry] = useState(() => (engine ? engine.get(src) : null));

        useEffect(() => {
          if (!engine) return;
          const existing = engine.get(src);
          if (existing) {
            setEntry(existing);
            return;
          }
          return engine.subscribe(src, (nextEntry) => {
            setEntry(nextEntry);
          });
        }, [src]);

        return {
          processedSrc: entry ? entry.dataUrl : null,
          isProcessing: !entry,
          dimensions: entry
            ? { width: entry.width, height: entry.height, aspectRatio: entry.aspectRatio }
            : null
        };
      }

      function ShopCatalogView({
        lockedCategoryId = null,
        lockedBrandId = null,
        initialCollection = null,
        searchQuery,
        setSearchQuery,
        onViewProduct,
        onAddToCart,
        navigate
      }) {
        const [selectedCategories, setSelectedCategories] = useState(lockedCategoryId ? [lockedCategoryId] : []);
        const [selectedBrands, setSelectedBrands] = useState(lockedBrandId ? [lockedBrandId] : []);
        const [selectedColors, setSelectedColors] = useState([]);
        const [selectedNicotine, setSelectedNicotine] = useState([]);
        const [selectedFlavors, setSelectedFlavors] = useState([]);
        const [selectedPuffRanges, setSelectedPuffRanges] = useState([]);
        const [maxPrice, setMaxPrice] = useState(100);
        const [sortBy, setSortBy] = useState('featured');
        const [perPage, setPerPage] = useState(12);
        const [currentPage, setCurrentPage] = useState(1);
        const [mobileFilterOpen, setMobileFilterOpen] = useState(false);
        const [activeCollection, setActiveCollection] = useState(initialCollection || 'all');

        useEffect(() => {
          setSelectedCategories(lockedCategoryId ? [lockedCategoryId] : []);
          setSelectedBrands(lockedBrandId ? [lockedBrandId] : []);
          setActiveCollection(initialCollection || 'all');
          setCurrentPage(1);
        }, [lockedCategoryId, lockedBrandId, initialCollection]);

        const scopedProducts = useMemo(() => {
          return SAMPLE_PRODUCTS.filter((p) => {
            if (lockedCategoryId && p.categoryId !== lockedCategoryId) return false;
            if (lockedBrandId && p.brandId !== lockedBrandId) return false;
            return true;
          });
        }, [lockedCategoryId, lockedBrandId]);

        const filterOptions = useMemo(() => {
          const colors = [...new Set(scopedProducts.map((p) => p.color))].filter(Boolean);
          const nicotines = [...new Set(scopedProducts.map((p) => p.nicotineStrength))].filter(
            (v) => v && !v.includes('Component') && !v.includes('Accessory')
          );
          const flavors = [...new Set(scopedProducts.map((p) => p.flavor))].filter((v) => v && !v.includes('N/A'));
          const puffRanges = [...new Set(scopedProducts.map((p) => p.puffRange))].filter((v) => v && v !== 'N/A');
          const brands = BRANDS.filter((b) => scopedProducts.some((p) => p.brandId === b.id));
          return { colors, nicotines, flavors, puffRanges, brands };
        }, [scopedProducts]);

        const filteredProducts = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          let list = scopedProducts.filter((p) => {
            if (activeCollection !== 'all' && !p.collection.includes(activeCollection)) return false;
            if (q) {
              const hay = `${p.name} ${p.brandName} ${p.categoryName} ${p.sku} ${p.flavor} ${p.color}`.toLowerCase();
              if (!hay.includes(q)) return false;
            }
            if (!lockedCategoryId && selectedCategories.length > 0 && !selectedCategories.includes(p.categoryId)) return false;
            if (!lockedBrandId && selectedBrands.length > 0 && !selectedBrands.includes(p.brandId)) return false;
            if (selectedColors.length > 0 && !selectedColors.includes(p.color)) return false;
            if (selectedNicotine.length > 0 && !selectedNicotine.includes(p.nicotineStrength)) return false;
            if (selectedFlavors.length > 0 && !selectedFlavors.includes(p.flavor)) return false;
            if (selectedPuffRanges.length > 0 && !selectedPuffRanges.includes(p.puffRange)) return false;
            if (p.price > maxPrice) return false;
            return true;
          });

          if (sortBy === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
          if (sortBy === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
          if (sortBy === 'name-asc') list = [...list].sort((a, b) => a.name.localeCompare(b.name));
          if (sortBy === 'newest') {
            list = [...list].sort((a, b) => (b.status === 'New' ? 1 : 0) - (a.status === 'New' ? 1 : 0));
          }
          return list;
        }, [
          scopedProducts,
          activeCollection,
          searchQuery,
          lockedCategoryId,
          lockedBrandId,
          selectedCategories,
          selectedBrands,
          selectedColors,
          selectedNicotine,
          selectedFlavors,
          selectedPuffRanges,
          maxPrice,
          sortBy
        ]);

        const totalPages = Math.max(1, Math.ceil(filteredProducts.length / perPage));
        const safePage = Math.min(currentPage, totalPages);
        const paginatedProducts = filteredProducts.slice((safePage - 1) * perPage, safePage * perPage);

        const toggleItem = (list, setter, value) => {
          setter(list.includes(value) ? list.filter((i) => i !== value) : [...list, value]);
          setCurrentPage(1);
        };

        const resetAllFilters = () => {
          if (!lockedCategoryId) setSelectedCategories([]);
          if (!lockedBrandId) setSelectedBrands([]);
          setSelectedColors([]);
          setSelectedNicotine([]);
          setSelectedFlavors([]);
          setSelectedPuffRanges([]);
          setMaxPrice(100);
          setActiveCollection('all');
          setSearchQuery('');
          setCurrentPage(1);
        };

        const hasActiveFilters =
          (!lockedCategoryId && selectedCategories.length > 0) ||
          (!lockedBrandId && selectedBrands.length > 0) ||
          selectedColors.length > 0 ||
          selectedNicotine.length > 0 ||
          selectedFlavors.length > 0 ||
          selectedPuffRanges.length > 0 ||
          maxPrice < 100 ||
          activeCollection !== 'all' ||
          searchQuery.trim() !== '';

        const renderFilterPanel = () =>
          h(
            'div',
            { className: 'space-y-6' },
            h(
              'div',
              { className: 'flex items-center justify-between pb-3 border-b border-[#242424]' },
              h('span', { className: 'text-xs font-black uppercase tracking-[0.18em] text-white' }, 'Filter Catalog'),
              hasActiveFilters &&
                h(
                  'button',
                  {
                    type: 'button',
                    onClick: resetAllFilters,
                    className: 'inline-flex items-center gap-1 text-[11px] font-mono text-[#F2C916] hover:text-white'
                  },
                  h(Icon, { name: 'rotateCcw', className: 'w-3 h-3' }),
                  h('span', null, 'Reset')
                )
            ),
            !lockedCategoryId &&
              h(
                'div',
                null,
                h('h4', { className: 'text-[11px] font-mono uppercase tracking-[0.18em] text-[#D0D0D0] mb-3' }, 'Category'),
                h(
                  'div',
                  { className: 'space-y-2' },
                  CATEGORIES.map((cat) =>
                    h(
                      'label',
                      { key: cat.id, className: 'flex items-center gap-2.5 text-xs text-[#CCCCCC] cursor-pointer hover:text-white' },
                      h('input', {
                        type: 'checkbox',
                        checked: selectedCategories.includes(cat.id),
                        onChange: () => toggleItem(selectedCategories, setSelectedCategories, cat.id),
                        className: 'accent-[#F2C916] w-4 h-4'
                      }),
                      h('span', null, cat.name)
                    )
                  )
                )
              ),
            !lockedBrandId &&
              filterOptions.brands.length > 0 &&
              h(
                'div',
                { className: 'pt-4 border-t border-[#222222]' },
                h('h4', { className: 'text-[11px] font-mono uppercase tracking-[0.18em] text-[#D0D0D0] mb-3' }, 'Brand'),
                h(
                  'div',
                  { className: 'space-y-2' },
                  filterOptions.brands.map((b) =>
                    h(
                      'label',
                      { key: b.id, className: 'flex items-center gap-2.5 text-xs text-[#CCCCCC] cursor-pointer hover:text-white' },
                      h('input', {
                        type: 'checkbox',
                        checked: selectedBrands.includes(b.id),
                        onChange: () => toggleItem(selectedBrands, setSelectedBrands, b.id),
                        className: 'accent-[#F2C916] w-4 h-4'
                      }),
                      h('span', null, b.name)
                    )
                  )
                )
              ),
            h(
              'div',
              { className: 'pt-4 border-t border-[#222222]' },
              h(
                'div',
                { className: 'flex items-center justify-between mb-2' },
                h('h4', { className: 'text-[11px] font-mono uppercase tracking-[0.18em] text-[#D0D0D0]' }, 'Max Price'),
                h('span', { className: 'text-xs font-mono text-[#F2C916]' }, `$${maxPrice}`)
              ),
              h('input', {
                type: 'range',
                min: 10,
                max: 100,
                step: 5,
                value: maxPrice,
                onChange: (e) => {
                  setMaxPrice(Number(e.target.value));
                  setCurrentPage(1);
                },
                className: 'w-full accent-[#F2C916]'
              })
            ),
            filterOptions.colors.length > 0 &&
              h(
                'div',
                { className: 'pt-4 border-t border-[#222222]' },
                h('h4', { className: 'text-[11px] font-mono uppercase tracking-[0.18em] text-[#D0D0D0] mb-3' }, 'Product Color'),
                h(
                  'div',
                  { className: 'flex flex-wrap gap-2' },
                  filterOptions.colors.map((c) => {
                    const active = selectedColors.includes(c);
                    return h(
                      'button',
                      {
                        key: c,
                        type: 'button',
                        onClick: () => toggleItem(selectedColors, setSelectedColors, c),
                        className: `px-2.5 py-1.5 text-[11px] border transition-colors ${
                          active
                            ? 'border-[#F2C916] bg-[#F2C916] text-[#090909] font-bold'
                            : 'border-[#303030] text-[#CCCCCC] hover:border-white'
                        }`
                      },
                      c
                    );
                  })
                )
              ),
            filterOptions.nicotines.length > 0 &&
              h(
                'div',
                { className: 'pt-4 border-t border-[#222222]' },
                h('h4', { className: 'text-[11px] font-mono uppercase tracking-[0.18em] text-[#D0D0D0] mb-3' }, 'Nicotine Strength'),
                h(
                  'div',
                  { className: 'space-y-2' },
                  filterOptions.nicotines.map((n) =>
                    h(
                      'label',
                      { key: n, className: 'flex items-center gap-2.5 text-xs text-[#CCCCCC] cursor-pointer hover:text-white' },
                      h('input', {
                        type: 'checkbox',
                        checked: selectedNicotine.includes(n),
                        onChange: () => toggleItem(selectedNicotine, setSelectedNicotine, n),
                        className: 'accent-[#F2C916] w-4 h-4'
                      }),
                      h('span', null, n)
                    )
                  )
                )
              ),
            filterOptions.flavors.length > 0 &&
              h(
                'div',
                { className: 'pt-4 border-t border-[#222222]' },
                h('h4', { className: 'text-[11px] font-mono uppercase tracking-[0.18em] text-[#D0D0D0] mb-3' }, 'Flavor Profile'),
                h(
                  'div',
                  { className: 'space-y-2' },
                  filterOptions.flavors.map((fl) =>
                    h(
                      'label',
                      { key: fl, className: 'flex items-center gap-2.5 text-xs text-[#CCCCCC] cursor-pointer hover:text-white' },
                      h('input', {
                        type: 'checkbox',

      function AccountPage() {
        const [tab, setTab] = useState('signin');
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState('');
        const [showPass, setShowPass] = useState(false);
        const [feedback, setFeedback] = useState(null);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!email.includes('@')) {
            setFeedback({
              type: 'error',
              msg: 'Please enter a valid email format to test client-side validation.'
            });
            return;
          }
          if (tab !== 'forgot' && password.length < 8) {
            setFeedback({
              type: 'error',
              msg: 'Password must be at least 8 characters. (No credentials are stored in this prototype.)'
            });
            return;
          }
          setFeedback({
            type: 'info',
            msg: 'Form validation passed. Live authentication backend is required before real customer accounts or passwords can be processed. No personal data was submitted or stored.'
          });
        };

        return h(
          'div',
          { className: 'max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-14' },
          h('p', { className: 'text-xs font-mono text-[#F2C916] uppercase tracking-[0.24em] mb-2' }, 'CUSTOMER ACCOUNT'),
          h('h1', { className: 'text-4xl sm:text-5xl font-black uppercase tracking-tight chrome-text mb-4' }, '4835 Member Access'),

              h('strong', { className: 'text-white uppercase' }, 'Authentication Backend Required: '),

          h(
            'div',
            { className: 'flex flex-wrap gap-2 mb-8 border-b border-[#242424] pb-4' },
            [
              { id: 'signin', label: 'Sign In' },
              { id: 'register', label: 'Register' },
              { id: 'forgot', label: 'Forgot Password' },
              { id: 'profile', label: 'Profile & Orders Preview' }
            ].map((t) =>
              h(

                  className: `px-4 py-2.5 text-xs font-black uppercase tracking-[0.14em] border transition-colors ${
                    tab === t.id
                      ? 'bg-[#F2C916] text-[#090909] border-[#F2C916]'

                'div',

                  'div',
                  { className: 'p-6 bg-[#101010] border border-[#242424]' },
                  h('h2', { className: 'text-sm font-black uppercase tracking-wider text-[#F2C916] mb-4' }, 'Account Profile Structure'),

                      h(

                    )

                      className: `p-3.5 text-xs leading-relaxed border ${

      // 8. CUSTOM GLOBAL FOOTER
      // ========================================================================
      function Footer({ navigate }) {
        return h(
          'footer',
          { className: 'bg-[#070707] text-[#D0D0D0] pt-16 pb-10' },
          h(
            'div',
            { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
            h(
              'div',
              { className: 'grid grid-cols-1 md:grid-cols-12 gap-10 pb-12 border-b border-[#202020]' },
              h(
                'div',
                { className: 'md:col-span-4' },
                h(
                  'div',
                  { className: 'flex items-center gap-3 mb-4' },
                  h('img', {
                    src: OFFICIAL_LOGO_URL,
                    alt: '4835 Smoke & Vape Official Logo',
                    loading: 'eager',
                    decoding: 'sync',
                    className: 'h-12 w-auto object-contain'
                  }),
                  h(
                    'div',
                    null,
                    h('div', { className: 'text-base font-black text-white tracking-[0.14em]' }, '4835 SMOKE & VAPE'),
                    h('div', { className: 'text-[11px] font-mono text-[#F2C916] tracking-[0.16em]' }, BUSINESS_INFO.tagline)
                  )
                ),
                h(
                  'p',
                  { className: 'text-xs text-[#999999] leading-relaxed mb-4' },
                  `${BUSINESS_INFO.secondaryMessage} — Dallas, Texas retail destination for 21+ adult smoke & vape hardware and essentials.`
                ),
                h('p', { className: 'text-[11px] font-mono text-[#777777]' }, 'WARNING: Nicotine is an addictive chemical. Strictly 21+ only.')
              ),
              h(
                'div',
                { className: 'md:col-span-2' },
                h('h3', { className: 'text-xs font-mono uppercase tracking-[0.2em] text-[#F2C916] mb-4' }, 'Shop'),
                h(
                  'ul',
                  { className: 'space-y-2.5 text-xs' },
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('shop'), className: 'hover:text-white' }, 'All Products')
                  ),
                  CATEGORIES.map((c) =>
                    h(
                      'li',
                      { key: c.id },
                      h(
                        'button',
                        {
                          type: 'button',
                          onClick: () => navigate('category', { id: c.id }),
                          className: 'hover:text-white'
                        },
                        c.name
                      )
                    )
                  )
                )
              ),
              h(
                'div',
                { className: 'md:col-span-3' },
                h('h3', { className: 'text-xs font-mono uppercase tracking-[0.2em] text-[#F2C916] mb-4' }, 'The 4835 Block'),
                h(
                  'ul',
                  { className: 'space-y-2.5 text-xs' },
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('brands'), className: 'hover:text-white' }, 'Brand Directory')
                  ),
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('about'), className: 'hover:text-white' }, 'About 4835')
                  ),
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('visit'), className: 'hover:text-white' }, 'Visit Us (Dallas, TX)')
                  ),
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('account'), className: 'hover:text-white' }, 'Customer Account')
                  ),
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('cart'), className: 'hover:text-white' }, 'Shopping Cart')
                  )
                )
              ),
              h(
                'div',
                { className: 'md:col-span-3' },
                h('h3', { className: 'text-xs font-mono uppercase tracking-[0.2em] text-[#F2C916] mb-4' }, 'Policies & Compliance'),
                h(
                  'ul',
                  { className: 'space-y-2.5 text-xs' },
                  h(
                    'li',
                    null,
                    h('button', { type: 'button', onClick: () => navigate('legal'), className: 'hover:text-white' }, 'Retail & Legal Compliance (TX / FDA)')

                )

            h(

              { className: 'pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] font-mono text-[#777777]' },

      // ========================================================================
      // 9. MAIN APPLICATION ROOT
      // ========================================================================
      function App() {
        const [route, setRoute] = useState({ page: 'home', params: {} });
        const [searchQuery, setSearchQuery] = useState('');
        const [seasonalEnabled, setSeasonalEnabled] = useState(true);
        const [holidayPopupOpen, setHolidayPopupOpen] = useState(false);
        const [toast, setToast] = useState(null);

        const [cart, setCart] = useState(() => {
          try {
            const saved = localStorage.getItem('4835_sample_cart');
            return saved ? JSON.parse(saved) : [];
          } catch {
            return [];
          }
        });

        useEffect(() => {
          try {
            localStorage.setItem('4835_sample_cart', JSON.stringify(cart));
          } catch {
            // Ignore storage quota errors
          }
        }, [cart]);

        useEffect(() => {
          if (!seasonalEnabled) return;
          try {
            const dismissed = sessionStorage.getItem('4835_holiday_dismissed');
            if (!dismissed) {
              const timer = setTimeout(() => setHolidayPopupOpen(true), 1200);
              return () => clearTimeout(timer);
            }
          } catch {
            // Ignore sessionStorage errors
          }
        }, [seasonalEnabled]);

        const dismissHolidayPopup = () => {
          setHolidayPopupOpen(false);
          try {
            sessionStorage.setItem('4835_holiday_dismissed', 'true');
          } catch {
            // Ignore
          }
        };

        const navigate = (page, params = {}) => {
          setRoute({ page, params });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const showToast = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(null), 2400);
        };

        const handleAddToCart = (product, quantity = 1) => {
          if (!product.available) return;
          setCart((prev) => {
            const existing = prev.find((i) => i.product.id === product.id);
            if (existing) {
              return prev.map((i) =>
                i.product.id === product.id ? { ...i, qty: i.qty + quantity } : i
              );
            }
            return [...prev, { product, qty: quantity }];
          });
          showToast(`Added "${product.name}" to cart`);
        };

        const handleUpdateQty = (productId, nextQty) => {
          if (nextQty <= 0) {
            setCart((prev) => prev.filter((i) => i.product.id !== productId));
            return;
          }
          setCart((prev) =>
            prev.map((i) => (i.product.id === productId ? { ...i, qty: nextQty } : i))
          );
        };

        const handleRemoveItem = (productId) => {
          setCart((prev) => prev.filter((i) => i.product.id !== productId));
        };

        const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);

        const renderPage = () => {
          switch (route.page) {
            case 'home':
              return h(HomePage, {
                navigate,
                onViewProduct: (id) => navigate('product', { id }),
                onAddToCart: handleAddToCart,
                seasonalEnabled
              });

            case 'shop':
              return h(
                'div',
                null,
                h(
                  'div',
                  { className: 'bg-[#0D0D0D] border-b border-[#222222] py-12 px-4 sm:px-6 lg:px-8' },
                  h(
                    'div',
                    { className: 'max-w-7xl mx-auto' },
                    h('p', { className: 'text-xs font-mono text-[#F2C916] uppercase tracking-[0.24em] mb-2' }, 'THE 4835 CATALOG'),
                    h('h1', { className: 'text-4xl sm:text-6xl font-black uppercase tracking-tight chrome-text' }, 'Shop All Products')
                  )
                ),
                h(ShopCatalogView, {
                  initialCollection: route.params?.collection,
                  searchQuery,
                  setSearchQuery,
                  onViewProduct: (id) => navigate('product', { id }),
                  onAddToCart: handleAddToCart,
                  navigate
                })
              );

            case 'category': {
              const cat = CATEGORIES.find((c) => c.id === route.params?.id) || CATEGORIES[0];
              return h(
                'div',
                null,
                h(
                  'div',
                  { className: 'relative bg-[#0D0D0D] border-b border-[#222222] py-14 px-4 sm:px-6 lg:px-8 overflow-hidden' },
                  h('img', {
                    src: cat.image,
                    alt: cat.name,
                    loading: 'eager',
                    decoding: 'sync',
                    className: 'absolute inset-0 w-full h-full object-cover opacity-20 grayscale'
                  }),
                  h(
                    'div',
                    { className: 'relative z-10 max-w-7xl mx-auto' },
                    h('p', { className: 'text-xs font-mono text-[#F2C916] uppercase tracking-[0.24em] mb-2' }, `CATEGORY INDEX ${cat.indexNum}`),
                    h('h1', { className: 'text-4xl sm:text-6xl font-black uppercase tracking-tight text-white mb-3' }, cat.name),
                    h('p', { className: 'text-sm sm:text-base text-[#D0D0D0] max-w-2xl' }, cat.shortDesc)
                  )
                ),
                h(ShopCatalogView, {
                  lockedCategoryId: cat.id,
                  searchQuery,
                  setSearchQuery,
                  onViewProduct: (id) => navigate('product', { id }),
                  onAddToCart: handleAddToCart,
                  navigate
                })
              );
            }

            case 'brands':
              return h(BrandDirectoryPage, { navigate });

            case 'brand': {
              const brand = BRANDS.find((b) => b.id === route.params?.id) || BRANDS[0];
              return h(
                'div',
                null,
                h(
                  'div',
                  { className: 'bg-[#0D0D0D] border-b border-[#222222] py-12 px-4 sm:px-6 lg:px-8' },
                  h(
                    'div',
                    { className: 'max-w-7xl mx-auto' },
                    h(
                      'button',
                      {
                        type: 'button',
                        onClick: () => navigate('brands'),
                        className: 'text-xs font-mono text-[#F2C916] uppercase tracking-wider hover:underline mb-3 inline-block'
                      },
                      '← Back to Brand Directory'
                    ),
                    h('h1', { className: 'text-4xl sm:text-6xl font-black uppercase tracking-tight chrome-text mb-2' }, brand.name),
                    h('p', { className: 'text-sm text-[#BDBDBD]' }, brand.tagline)
                  )
                ),
                h(ShopCatalogView, {
                  lockedBrandId: brand.id,
                  searchQuery,
                  setSearchQuery,
                  onViewProduct: (id) => navigate('product', { id }),
                  onAddToCart: handleAddToCart,
                  navigate
                })
              );
            }

            case 'product':
              return h(ProductDetailPage, {
                productId: route.params?.id,
                navigate,
                onAddToCart: handleAddToCart
              });

            case 'about':
              return h(AboutPage, { navigate });

            case 'visit':
              return h(VisitUsPage);

            case 'cart':
              return h(CartPage, {
                cart,
                onUpdateQty: handleUpdateQty,
                onRemoveItem: handleRemoveItem,
                onClearCart: () => setCart([]),
                navigate
              });

            case 'account':
              return h(AccountPage);

            case 'privacy':
              return h(PolicyPage, { type: 'privacy' });

            case 'terms':
              return h(PolicyPage, { type: 'terms' });

            case 'legal':
              return h(PolicyPage, { type: 'legal' });

            default:
              return h(HomePage, {
                navigate,
                onViewProduct: (id) => navigate('product', { id }),
                onAddToCart: handleAddToCart,
                seasonalEnabled
              });
          }
        };

        return h(
          'div',
          { className: 'min-h-screen bg-[#090909] text-white font-sans flex flex-col' },
          h(SnowfallCanvas, { enabled: seasonalEnabled }),
          h(ChristmasPopup, {
            open: seasonalEnabled && holidayPopupOpen,
            onDismiss: dismissHolidayPopup,
            onExploreShop: () => navigate('shop')
          }),
          h(Header, {
            currentRoute: route,
            navigate,
            cartCount,
            seasonalEnabled,
            onToggleSeasonal: () => setSeasonalEnabled((s) => !s),
            onOpenHolidayPopup: () => setHolidayPopupOpen(true),
            searchQuery,
            setSearchQuery
          }),
          h('main', { className: 'flex-1' }, renderPage()),
          h(Footer, { navigate }),
          toast &&
            h(
              'div',
              {
                role: 'status',
                className: 'fixed bottom-5 right-5 z-50 px-5 py-3.5 bg-[#F2C916] text-[#090909] font-black text-xs uppercase tracking-[0.14em] shadow-2xl flex items-center gap-2 animate-fadeIn'
              },
              h(Icon, { name: 'check', className: 'w-4 h-4' }),
              h('span', null, toast)
            )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(h(App));
    });
  </script>
</body>
